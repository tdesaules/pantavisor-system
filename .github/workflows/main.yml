# Generated by github-actions/scripts/pantavisor_consumers.py
name: main
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      maintenance:
        description: Run maintenance instead of preparing a release
        type: boolean
        default: false
      renovate-dry-run:
        description: Resolve dependency updates without writing branches
        type: boolean
        default: true
  schedule:
    - cron: '37 5 * * 1'
permissions:
  contents: read
concurrency:
  group: pantavisor-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
env:
  PROJECT: system
jobs:
  check:
    if: github.event_name != 'schedule' && !inputs.maintenance
    runs-on: ubuntu-24.04
    outputs:
      candidate-id: ${{ steps.candidate-upload.outputs.artifact-id }}
      build: ${{ github.ref_type != 'tag' && steps.select.outputs.build-required == 'true' && (github.event_name != 'workflow_dispatch' || steps.candidate.outputs.changed == 'true') }}
      revision: ${{ steps.candidate.outputs.revision || github.sha }}
      core: ${{ steps.components.outputs.core }}
      k0s: ${{ steps.components.outputs.k0s }}
      actionlint: ${{ steps.files.outputs.actionlint-files }}
      hadolint: ${{ steps.files.outputs.hadolint-files }}
      shellcheck: ${{ steps.files.outputs.shellcheck-files }}
      yaml: ${{ steps.files.outputs.yaml-files }}
      markdown: ${{ steps.files.outputs.markdownlint-files }}
      links: ${{ steps.files.outputs.lychee-files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Read changed files
        id: files
        uses: tdesaules/github-actions/workflow/get-changed-files@1.6.1
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          full: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
      - name: Select work
        id: select
        uses: tdesaules/github-actions/workflow/get-pantavisor-targets@1.6.1
        with:
          project: ${{ env.PROJECT }}
          files: ${{ steps.files.outputs.files }}
          full: ${{ steps.files.outputs.full }}
      - name: Prepare release candidate
        id: candidate
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/new-pantavisor-candidate@1.6.1
        with:
          project: ${{ env.PROJECT }}
      - name: Check release App access before building
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Test producer contracts
        if: steps.select.outputs.check-required == 'true'
        uses: tdesaules/github-actions/check/test-pantavisor-system@1.6.1
      - name: Read immutable component inputs
        id: components
        uses: tdesaules/github-actions/workflow/read-pantavisor-components@1.6.1
      - name: Retain exact candidate commit
        id: candidate-upload
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: artifacts/release/
          if-no-files-found: error
  lint:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Actionlint
        if: needs.check.outputs.actionlint != '[]'
        uses: tdesaules/github-actions/lint/actionlint@1.6.1
        with: {files: '${{ needs.check.outputs.actionlint }}'}
      - name: Hadolint
        if: needs.check.outputs.hadolint != '[]'
        uses: tdesaules/github-actions/lint/hadolint@1.6.1
        with: {files: '${{ needs.check.outputs.hadolint }}'}
      - name: ShellCheck
        if: needs.check.outputs.shellcheck != '[]'
        uses: tdesaules/github-actions/lint/shellcheck@1.6.1
        with: {files: '${{ needs.check.outputs.shellcheck }}'}
      - name: YAML
        if: needs.check.outputs.yaml != '[]'
        uses: tdesaules/github-actions/lint/yaml@1.6.1
        with: {files: '${{ needs.check.outputs.yaml }}'}
      - name: Markdown
        if: needs.check.outputs.markdown != '[]'
        uses: tdesaules/github-actions/lint/markdownlint@1.6.1
        with: {files: '${{ needs.check.outputs.markdown }}'}
      - name: Local links
        if: needs.check.outputs.links != '[]'
        uses: tdesaules/github-actions/lint/lychee@1.6.1
        with: {files: '${{ needs.check.outputs.links }}'}
  build:
    needs: [check, lint]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions: {contents: read, packages: read}
    outputs:
      artifact-id: ${{ steps.build-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Fetch candidate commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ needs.check.outputs.candidate-id }}', path: artifacts/release, merge-multiple: true}
      - name: Import candidate
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/import-pantavisor-candidate@1.6.1
      - name: Build with KAS
        uses: tdesaules/github-actions/workflow/build-pantavisor@1.6.1
        with: {project: '${{ env.PROJECT }}', cold: 'true'}
      - name: Package public component
        uses: tdesaules/github-actions/workflow/package-pantavisor-bsp@1.6.1
      - name: Verify component
        uses: tdesaules/github-actions/oci/test-component@1.6.1
        with: {directory: dist/bsp}
      - name: Fetch core by digest
        uses: tdesaules/github-actions/oci/get-component@1.6.1
        with:
          reference: ${{ needs.check.outputs.core }}
          output: dist/core
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Read verified core identity
        id: core
        uses: tdesaules/github-actions/oci/test-component@1.6.1
        with: {directory: dist/core}
      - name: Verify core publisher signature
        continue-on-error: true
        uses: tdesaules/github-actions/oci/test-image-signature@1.6.1
        with:
          image: ${{ needs.check.outputs.core }}
          identity: https://github.com/${{ github.repository_owner }}/pantavisor-core/.github/workflows/main.yml@refs/tags/v${{ steps.core.outputs.version }}
          issuer: https://token.actions.githubusercontent.com
          output: artifacts/inputs/core-signature.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Fetch k0s by digest
        uses: tdesaules/github-actions/oci/get-component@1.6.1
        with:
          reference: ${{ needs.check.outputs.k0s }}
          output: dist/k0s
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Read verified k0s identity
        id: k0s
        uses: tdesaules/github-actions/oci/test-component@1.6.1
        with: {directory: dist/k0s}
      - name: Verify k0s publisher signature
        continue-on-error: true
        uses: tdesaules/github-actions/oci/test-image-signature@1.6.1
        with:
          image: ${{ needs.check.outputs.k0s }}
          identity: https://github.com/${{ github.repository_owner }}/pantavisor-k0s/.github/workflows/main.yml@refs/tags/v${{ steps.k0s.outputs.version }}
          issuer: https://token.actions.githubusercontent.com
          output: artifacts/inputs/k0s-signature.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Assemble base
        uses: tdesaules/github-actions/workflow/assemble-pantavisor@1.6.1
        with: {profile: base, output: dist/platform-base}
      - name: Assemble k0s
        uses: tdesaules/github-actions/workflow/assemble-pantavisor@1.6.1
        with: {profile: k0s, k0s: dist/k0s, output: dist/platform-k0s}
      - name: Record untested outputs
        uses: tdesaules/github-actions/workflow/new-pantavisor-receipt@1.6.1
        with:
          project: ${{ env.PROJECT }}
          revision: ${{ needs.check.outputs.revision }}
      - name: Transfer untested outputs
        id: build-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: untested-${{ env.PROJECT }}-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/build-receipt.json
          if-no-files-found: error
          compression-level: 0
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics-${{ env.PROJECT }}-${{ github.run_attempt }}
          path: artifacts/ci/build-report.json
  test:
    needs: [check, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: [base, k0s]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Fetch candidate commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ needs.check.outputs.candidate-id }}', path: artifacts/release, merge-multiple: true}
      - name: Import candidate
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/import-pantavisor-candidate@1.6.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ needs.build.outputs.artifact-id }}', path: ., merge-multiple: true}
      - name: Verify transferred outputs
        uses: tdesaules/github-actions/workflow/test-pantavisor-artifact@1.6.1
        with: {revision: '${{ needs.check.outputs.revision }}'}
      - name: Qualify complete platform
        uses: tdesaules/github-actions/workflow/test-pantavisor-platform@1.6.1
        with:
          bundle: dist/platform-${{ matrix.profile }}
          output: artifacts/qualification-${{ matrix.profile }}
          reports: artifacts/reports
      - name: Generate image SBOM
        id: security-spdx
        continue-on-error: true
        uses: tdesaules/github-actions/oci/new-sbom@1.6.1
        with:
          source: dir:dist/bsp
          output: artifacts/reports/sbom.spdx.json
      - name: Capture scan evidence
        id: security-sbom
        continue-on-error: true
        uses: tdesaules/github-actions/oci/new-sbom@1.6.1
        env:
          SYFT_GOLANG_CAPTURE_SYMBOLS: all
          SYFT_FILE_METADATA_SELECTION: all
        with:
          source: dir:dist/bsp
          format: syft-json
          output: artifacts/reports/sbom.syft.json
      - name: Report vulnerabilities
        id: security-scan
        if: steps.security-sbom.outcome == 'success'
        continue-on-error: true
        uses: tdesaules/github-actions/oci/test-vulnerabilities@1.6.1
        with:
          fail-on: none
          sbom: artifacts/reports/sbom.syft.json
          output: artifacts/reports/grype.json
      - name: Summarize advisory security outcomes
        if: always()
        continue-on-error: true
        uses: tdesaules/github-actions/workflow/test-step-outcomes@1.6.1
        env:
          SECURITY_COMPONENT: ${{ env.PROJECT }}
          SECURITY_ARCHITECTURE: arm64
          SECURITY_RECEIPT: artifacts/build-receipt.json
          SECURITY_REPORT: artifacts/reports/grype.json
          SECURITY_OUTPUT: artifacts/reports/security-status.json
        with:
          outcomes: ${{ toJSON(steps) }}
      - name: Record successful qualification
        uses: tdesaules/github-actions/workflow/new-pantavisor-qualification@1.6.1
        with:
          revision: ${{ needs.check.outputs.revision }}
          profile: ${{ matrix.profile }}
      - name: Retain tested platform outputs
        if: matrix.profile == 'base'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-system-base-${{ needs.build.outputs.artifact-id }}-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/qualified-receipt.json
          compression-level: 0
          if-no-files-found: error
      - name: Retain independent k0s qualification
        if: matrix.profile == 'k0s'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-system-k0s-${{ needs.build.outputs.artifact-id }}-${{ github.run_attempt }}
          path: artifacts/qualified-receipt.json
          if-no-files-found: error
      - name: Retain reports even on failure
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-system-${{ matrix.profile }}-${{ github.run_attempt }}
          path: artifacts/reports/
  release:
    needs: [check, lint, build, test]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.lint.result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.test.result == 'success') || github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    permissions: {contents: write, packages: write, actions: read, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and preparation run
        if: github.ref_type == 'tag'
        id: provenance
        uses: tdesaules/github-actions/workflow/read-pantavisor-release@1.6.1
        with: {token: '${{ github.token }}'}
      - name: Fetch previously qualified release outputs
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ steps.provenance.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .
      - name: Find matching profile artifacts across attempts
        id: profiles
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/get-pantavisor-qualification@1.6.1
        with:
          build-artifact-id: ${{ needs.build.outputs.artifact-id }}
          token: ${{ github.token }}
      - name: Fetch base qualification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ steps.profiles.outputs.base-id }}', path: ., merge-multiple: true}
      - name: Fetch k0s qualification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ steps.profiles.outputs.k0s-id }}', path: artifacts/profile-k0s, merge-multiple: true}
      - name: Require both profiles against identical artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/merge-pantavisor-qualification@1.6.1
        with: {revision: '${{ needs.check.outputs.revision }}'}
      - name: Retain complete platform qualification
        id: complete-upload
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-system-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/qualified-receipt.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Fetch candidate commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {artifact-ids: '${{ needs.check.outputs.candidate-id }}', path: artifacts/release, merge-multiple: true}
      - name: Import candidate
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/import-pantavisor-candidate@1.6.1
      - name: Verify qualification before publication
        id: qualified
        uses: tdesaules/github-actions/workflow/test-pantavisor-artifact@1.6.1
        with:
          revision: ${{ needs.check.outputs.revision }}
          receipt: artifacts/qualified-receipt.json
          require-tested: 'true'
          receipt-digest: ${{ steps.provenance.outputs.receipt-digest }}
      - name: Create release App token
        if: github.event_name == 'workflow_dispatch'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Finalize qualified commit and tag
        if: github.event_name == 'workflow_dispatch'
        uses: tdesaules/github-actions/workflow/complete-pantavisor-release@1.6.1
        with:
          token: ${{ steps.app.outputs.token }}
          artifact-id: ${{ steps.complete-upload.outputs.artifact-id }}
      - name: Publish component by digest
        if: github.ref_type == 'tag'
        id: component
        uses: tdesaules/github-actions/oci/publish-component@1.6.1
        with:
          directory: dist/bsp
          registry: ghcr.io/${{ github.repository }}/bsp
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Sign component
        id: security-signatures-sign-component
        continue-on-error: true
        if: github.ref_type == 'tag'
        uses: tdesaules/github-actions/oci/new-image-signature@1.6.1
        with:
          image: ${{ steps.component.outputs.reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Verify component signature
        id: security-signatures-verify-component
        continue-on-error: true
        if: github.ref_type == 'tag'
        uses: tdesaules/github-actions/oci/test-image-signature@1.6.1
        with:
          image: ${{ steps.component.outputs.reference }}
          identity: https://github.com/${{ github.repository }}/.github/workflows/main.yml@${{ github.ref }}
          issuer: https://token.actions.githubusercontent.com
          output: artifacts/publication/component-signature.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Summarize publication security
        if: always()
        continue-on-error: true
        uses: tdesaules/github-actions/workflow/test-step-outcomes@1.6.1
        env:
          SECURITY_COMPONENT: ${{ env.PROJECT }}
          SECURITY_SUBJECT: ${{ steps.component.outputs.reference }}
          SECURITY_SUBJECTS: >-
            {"security-signatures-sign-image":"ghcr.io/${{ github.repository }}@${{ steps.qualified.outputs.image-digest }}",
            "security-signatures-verify-image":"ghcr.io/${{ github.repository }}@${{ steps.qualified.outputs.image-digest }}",
            "security-signatures-sign-component":"${{ steps.component.outputs.reference }}",
            "security-signatures-verify-component":"${{ steps.component.outputs.reference }}"}
          SECURITY_OUTPUT: artifacts/publication/security-status.json
        with:
          outcomes: ${{ toJSON(steps) }}
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: tdesaules/github-actions/workflow/new-pantavisor-github-release@1.6.1
        with:
          receipt-digest: ${{ steps.provenance.outputs.receipt-digest }}
          component: ${{ steps.component.outputs.reference }}
          token: ${{ github.token }}
      - name: Retain publication evidence
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ env.PROJECT }}-${{ github.run_attempt }}
          path: artifacts/release-manifest.json
      - name: Retain publication security reports
        if: always() && github.ref_type == 'tag'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-security-${{ env.PROJECT }}-${{ github.run_attempt }}
          path: artifacts/publication/
          if-no-files-found: warn
  maintenance:
    if: github.event_name == 'schedule' || inputs.maintenance
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Create shared bot App token for Renovate
        if: '!cancelled()'
        id: bot-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Update dependencies
        if: ${{ !cancelled() && steps.bot-token.outcome == 'success' }}
        uses: tdesaules/github-actions/maintenance/update-dependencies@1.6.1
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.bot-token.outputs.token }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.renovate-dry-run || false }}
      - name: Read published release
        id: published
        if: ${{ !cancelled() }}
        uses: tdesaules/github-actions/workflow/read-pantavisor-published@1.6.1
        with: {token: '${{ github.token }}'}
      - name: Fetch published BSP
        if: ${{ !cancelled() && steps.published.outputs.has-release == 'true' }}
        uses: tdesaules/github-actions/oci/get-component@1.6.1
        with:
          reference: ${{ steps.published.outputs.component }}
          output: artifacts/maintenance/bsp
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
      - name: Inventory published BSP
        continue-on-error: true
        if: ${{ !cancelled() && steps.published.outputs.has-release == 'true' }}
        uses: tdesaules/github-actions/oci/new-sbom@1.6.1
        with:
          source: dir:artifacts/maintenance/bsp
          format: syft-json
          output: artifacts/maintenance/sbom.syft.json
      - name: Rescan published image
        id: security-scan
        continue-on-error: true
        if: ${{ !cancelled() && steps.published.outputs.has-release == 'true' }}
        uses: tdesaules/github-actions/oci/test-vulnerabilities@1.6.1
        with:
          fail-on: none
          sbom: artifacts/maintenance/sbom.syft.json
          output: artifacts/maintenance/grype.json
      - name: Summarize maintenance security
        if: always()
        continue-on-error: true
        uses: tdesaules/github-actions/workflow/test-step-outcomes@1.6.1
        env:
          SECURITY_COMPONENT: ${{ env.PROJECT }}
          SECURITY_REPORT: artifacts/maintenance/grype.json
          SECURITY_OUTPUT: artifacts/maintenance/security-status.json
        with:
          outcomes: ${{ toJSON(steps) }}
      - name: Retain maintenance reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'maintenance-reports-${{ github.run_attempt }}', path: artifacts/maintenance/}
      - name: List documentation
        id: files
        uses: tdesaules/github-actions/workflow/get-changed-files@1.6.1
        with: {full: 'true'}
      - name: Check documentation links
        uses: tdesaules/github-actions/lint/lychee@1.6.1
        with: {files: '${{ steps.files.outputs.lychee-files }}'}
